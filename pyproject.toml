[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "helm-coordinator"
version = "1.0.0"
description = "A thin, local-first conversational multi-project AI coordinator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
helm = "helm.cli:main"

[tool.setuptools.packages.find]
include = ["helm*"]
